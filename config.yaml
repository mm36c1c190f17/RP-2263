data:
  raw_file: "data/raw/experimental_data.csv"
  processed_file: "data/processed/experimental_data_processed.csv"
  
  features:
    categorical:
      - base_type
      - base_manufacturer
      - filler_type
      - filler_manufacturer
    numerical:
      - base_hardness
      - filler_content
      - temp
      - time
  
  targets:
    - strength_initial
    - elongation_initial
    - strength_aged_240h_250C
    - elongation_aged_240h_250C
    - strength_aged_72h_250C
    - elongation_aged_72h_250C
    - resistivity
    - permittivity
    - tan_delta
    - dielectric_strength
    - ceramic_strength

model:
  type: "knn"
  params:
    n_neighbors: 1

training:
  test_size: 0.2
  random_state: 42

output:
  models_dir: "models/"
  plots_dir: "plots/"
  predictions_file: "predictions.csv"
